name: Release

on:
  push:
    tags:
      - '**'

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Uploads nowhere but to this repository's GitHub release: the TOC names no CurseForge,
      # WoWInterface or Wago project. Add ## X-Curse-Project-ID to the TOC once Known Recipes has one.
      - name: Create Package
        uses: BigWigsMods/packager@v2